[workspace]
members = ["crates/todo-or-die-core", "crates/todo-or-die-tree-sitter", "crates/todo-or-die-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin = "0.3"
tree-sitter-legacy = { package = "tree-sitter", version = "0.20" }
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
