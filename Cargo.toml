[package]
name = "todo-or-die"
version = "0.2.0"
edition.workspace = true

[dependencies]
todo-or-die-core = { path = "crates/todo-or-die-core" }
todo-or-die-tree-sitter = { path = "crates/todo-or-die-tree-sitter" }
todo-or-die-providers = { path = "crates/todo-or-die-providers" }
todo-or-die-cel = { path = "crates/todo-or-die-cel" }
clap.workspace = true
ignore.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
toml.workspace = true
serde.workspace = true
semver.workspace = true

[[bin]]
name = "todo-or-die"
path = "crates/todo-or-die-cli/src/main.rs"

[workspace]
members = ["crates/todo-or-die-core", "crates/todo-or-die-tree-sitter", "crates/todo-or-die-cel", "crates/todo-or-die-providers", "crates/todo-or-die-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
cel-interpreter = { version = "0.10", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
semver = "1"
urlencoding = "2"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
