name: Build binaries

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cross-build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: todo-or-die-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            archive: todo-or-die-aarch64-unknown-linux-gnu.tar.gz
          - target: x86_64-pc-windows-gnu
            archive: todo-or-die-x86_64-pc-windows-gnu.zip
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: contains(matrix.target, 'linux')
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.archive }} todo-or-die
      - name: Package Windows binary
        if: runner.os == 'Linux' && startsWith(matrix.target, 'x86_64-pc-windows')
        run: 7z a ${{ matrix.archive }} ./target/${{ matrix.target }}/release/todo-or-die.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.archive }}" --clobber

  macos-universal:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build both macOS architectures
        run: |
          cargo zigbuild --release --target x86_64-apple-darwin
          cargo zigbuild --release --target aarch64-apple-darwin
      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/todo-or-die \
            target/aarch64-apple-darwin/release/todo-or-die \
            -output dist/todo-or-die
            tar -C dist -czf todo-or-die-x86_64-apple-darwin.tar.gz todo-or-die
            cp todo-or-die-x86_64-apple-darwin.tar.gz todo-or-die-aarch64-apple-darwin.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: todo-or-die-macos-universal.tar.gz
          path: todo-or-die-*-apple-darwin.tar.gz
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" todo-or-die-*-apple-darwin.tar.gz --clobber
