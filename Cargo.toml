[workspace]
members = ["crates/todo-or-die-core", "crates/todo-or-die-tree-sitter", "crates/todo-or-die-cel", "crates/todo-or-die-providers", "crates/todo-or-die-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
cel-interpreter = { version = "0.10", features = ["json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
semver = "1"
urlencoding = "2"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
